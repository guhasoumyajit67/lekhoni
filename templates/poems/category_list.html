{% extends "base.html" %}
{% load bengali_numbers %}

{% block title %}বিভাগ - লেখনী{% endblock %}

{% block content %}
<div class="py-4">
    <h2 class="text-center mb-4" style="font-family: 'Noto Serif Bengali', serif;">
        <i class="fas fa-tags me-2" style="color: #2A7F7A;"></i>
        বিভাগ
    </h2>
    
    <div class="row g-4 justify-content-center">
        {% for category in categories %}
        <div class="col-md-3 col-sm-4">
            <a href="{% url 'category_detail' category.slug %}" class="text-decoration-none">
                <div class="card text-center border-0 shadow-sm hover-lift">
                    <div class="card-body p-4">
                        <i class="fas {{ category.icon|default:'fa-folder-open' }} fs-1" style="color: #2A7F7A;"></i>
                        <h5 class="mt-3 mb-1">{{ category.name }}</h5>
                        <p class="text-muted small">{{ category.poem_count|bengali_num|default:"০" }}টি কবিতা</p>
                    </div>
                </div>
            </a>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <i class="fas fa-folder-open" style="font-size: 48px; color: #ddd;"></i>
            <p class="text-muted mt-3">কোনো বিভাগ নেই।</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
