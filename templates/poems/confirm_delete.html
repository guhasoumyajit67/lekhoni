{% extends "base.html" %}

{% block title %}কবিতা ডিলিট - লেখনী{% endblock %}

{% block content %}
<div class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <i class="fas fa-exclamation-triangle" style="font-size: 48px; color: #C45A3C;"></i>
                    <h3 class="mt-3" style="font-family: 'Noto Serif Bengali', serif;">"{{ poem.title }}" ডিলিট?</h3>
                    <p class="text-muted">আপনি কি নিশ্চিত যে আপনি এই কবিতাটি ডিলিট করতে চান?</p>
                    <p class="text-danger small">এই কাজটি বাতিল করা যাবে না।</p>
                    
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <a href="{% url 'my_poems' %}" class="btn btn-outline-secondary">
                                <i class="fas fa-times me-2"></i> বাতিল
                            </a>
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-2"></i> ডিলিট করুন
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
