{% extends "base.html" %}
{% load static %}

{% block title %}কবিতা ডিলিট - লেখনী{% endblock %}

{% block content %}
<div class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm hover-lift border-0">
                <div class="card-body p-4 p-md-5 text-center">
                    <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: #C45A3C;"></i>
                    
                    <h3 class="mt-3 mb-2" style="font-family: 'Noto Serif Bengali', serif;">
                        "{{ poem.title }}" ডিলিট?
                    </h3>
                    
                    <p class="text-muted mb-2">
                        আপনি কি নিশ্চিত যে আপনি এই কবিতাটি ডিলিট করতে চান?
                    </p>
                    
                    <p class="text-danger small mb-4">
                        <i class="fas fa-exclamation-circle me-1"></i>
                        এই কাজটি বাতিল করা যাবে না।
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                            <a href="{% url 'my_poems' %}" class="btn btn-outline-secondary btn-lg rounded-pill px-4">
                                <i class="fas fa-times me-2"></i> বাতিল
                            </a>
                            <button type="submit" class="btn btn-danger btn-lg rounded-pill px-4">
                                <i class="fas fa-trash me-2"></i> ডিলিট করুন
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
