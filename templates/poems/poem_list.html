{% extends "base.html" %}
{% load static %}
{% load bengali_numbers %}

{% block title %}সব কবিতা - লেখনী{% endblock %}

{% block content %}
<div class="py-3">
    <h2 class="text-center mb-5" style="font-family: 'Noto Serif Bengali', serif; font-size: 1.8rem;">
        <i class="fas fa-book-open me-2" style="color: #2A7F7A;"></i>
        সব কবিতা
    </h2>
    
    <!-- CONTAINER FOR POEMS -->
    <div class="row g-3" id="poem-container">
        {% include 'partials/_poem_card.html' %}
    </div>
    
    <div class="text-center mt-4" id="load-more-wrapper">
        <button id="load-more-btn" class="btn btn-outline-teal">
            <i class="fas fa-plus-circle me-2"></i> আরও লোড করুন
        </button>
    </div>
</div>

{% block extra_js %}
<!-- ✅ Load the external JS file -->
<script src="{% static 'js/poem_list.js' %}"></script>
{% endblock extra_js %}
{% endblock %}
