{% extends "base.html" %}
{% load static %}
{% load bengali_numbers %}

{% block title %}সব কবিতা - লেখনী{% endblock %}

{% block content %}
<div class="py-3">
    <h2 class="text-center mb-5" style="font-family: 'Noto Serif Bengali', serif; font-size: 1.8rem;">
        <i class="fas fa-book-open me-2" style="color: #2A7F7A;"></i>
        সব কবিতা
    </h2>
    
    <!-- CONTAINER FOR POEMS -->
    <div class="row g-3" id="poem-container">
        {% include 'partials/_poem_card.html' %}
    </div>
    
    <!-- 🚨 UPDATED: Removed 'btn-lg' to make it medium-sized -->
    <div class="text-center mt-4" id="load-more-wrapper">
        <button id="load-more-btn" class="btn btn-outline-teal">
            <i class="fas fa-plus-circle me-2"></i> আরও লোড করুন
        </button>
    </div>
</div>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const loadMoreBtn = document.getElementById('load-more-btn');
    const loadMoreWrapper = document.getElementById('load-more-wrapper');
    const poemContainer = document.getElementById('poem-container');
    
    // Track which page we are currently on
    let currentPage = 2;

    loadMoreBtn.addEventListener('click', function() {
        // Disable button and show loading spinner
        loadMoreBtn.disabled = true;
        loadMoreBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> লোড হচ্ছে...';

        // Fetch the next batch of poems
        fetch(`/poems/load-more/?page=${currentPage}`)
        .then(response => response.json())
        .then(data => {
            if (data.html) {
                // Append the new poems to the bottom of the container
                poemContainer.insertAdjacentHTML('beforeend', data.html);
                currentPage++; // Increment page counter for next click
            }
            
            if (data.has_next) {
                // If there are more poems, re-enable the button
                loadMoreBtn.disabled = false;
                loadMoreBtn.innerHTML = '<i class="fas fa-plus-circle me-2"></i> আরও লোড করুন';
            } else {
                // If no more poems, replace button with a message
                loadMoreWrapper.innerHTML = '<p class="text-muted">সব কবিতা লোড করা হয়েছে!</p>';
            }
        })
        .catch(error => {
            console.error('Error loading poems:', error);
            loadMoreBtn.disabled = false;
            loadMoreBtn.innerHTML = '<i class="fas fa-plus-circle me-2"></i> আরও লোড করুন';
            alert('লোড করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
        });
    });
});
</script>
{% endblock extra_js %}
{% endblock %}
