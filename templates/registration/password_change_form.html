{% extends "base.html" %}

{% block title %}পাসওয়ার্ড পরিবর্তন - লেখনী{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-3">পাসওয়ার্ড পরিবর্তন</h3>
                <p class="text-muted text-center small mb-4">
                    নিরাপত্তার জন্য প্রথমে আপনার পুরোনো পাসওয়ার্ড দিন।
                </p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">পাসওয়ার্ড পরিবর্তন করুন</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
