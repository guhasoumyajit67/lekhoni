{% extends "base.html" %}
{% load static %}

{% block title %}পাসওয়ার্ড পরিবর্তন - লেখনী{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm hover-lift border-0">
            <div class="card-body p-4 p-md-5">
                <h3 class="text-center mb-4" style="font-family: 'Noto Serif Bengali', serif;">
                    <i class="fas fa-key me-2" style="color: #C45A3C;"></i>
                    পাসওয়ার্ড পরিবর্তন
                </h3>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small text-uppercase tracking-wider">পুরোনো পাসওয়ার্ড</label>
                        <input type="password" name="old_password" class="form-control rounded-3" placeholder="আপনার পুরোনো পাসওয়ার্ড" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small text-uppercase tracking-wider">নতুন পাসওয়ার্ড</label>
                        <input type="password" name="new_password1" class="form-control rounded-3" placeholder="নতুন পাসওয়ার্ড" required>
                        <div class="form-text text-muted small mt-1">
                            <i class="fas fa-info-circle me-1"></i>
                            পাসওয়ার্ড কমপক্ষে ৮ অক্ষরের হতে হবে।
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold text-secondary small text-uppercase tracking-wider">পাসওয়ার্ড নিশ্চিত করুন</label>
                        <input type="password" name="new_password2" class="form-control rounded-3" placeholder="আবার পাসওয়ার্ড দিন" required>
                    </div>
                    
                    <div class="d-grid gap-3 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            <i class="fas fa-save me-2"></i> পাসওয়ার্ড পরিবর্তন করুন
                        </button>
                        <a href="{% url 'profile' %}" class="btn btn-outline-secondary btn-lg rounded-pill">
                            <i class="fas fa-arrow-left me-2"></i> প্রোফাইলে ফিরুন
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
