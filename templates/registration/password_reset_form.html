{% extends "base.html" %}

{% block title %}পাসওয়ার্ড রিসেট - লেখনী{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">
                    <i class="fas fa-key me-2" style="color: #C45A3C;"></i>
                    পাসওয়ার্ড ভুলে গেছেন?
                </h3>
                <p class="text-muted text-center small mb-4">
                    আপনার ইমেইল ঠিকানা দিন। আমরা পাসওয়ার্ড রিসেট করার নির্দেশনা পাঠিয়ে দেব।
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-bold">ইমেইল</label>
                        <input type="email" name="email" class="form-control" placeholder="আপনার ইমেইল" required>
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-paper-plane me-2"></i> নির্দেশনা পাঠান
                        </button>
                        <a href="{% url 'login' %}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left me-2"></i> লগইন পেজে ফিরুন
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
