{% extends "base.html" %}

{% block title %}পাসওয়ার্ড রিসেট - লেখনী{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="text-center mb-3">পাসওয়ার্ড ভুলে গেছেন?</h3>
                <p class="text-muted text-center small mb-4">
                    আপনার ইমেইল ঠিকানা দিন। আমরা পাসওয়ার্ড রিসেট করার নির্দেশনা পাঠিয়ে দেব।
                </p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">নির্দেশনা পাঠান</button>
                </form>
                <p class="text-center mt-3">
                    <a href="{% url 'login' %}">লগইন পেজে ফিরুন</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
