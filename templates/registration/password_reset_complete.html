{% extends "base.html" %}
{% load static %}

{% block title %}রিসেট সম্পূর্ণ - লেখনী{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4 text-center">
        <div class="card shadow-sm hover-lift border-0">
            <div class="card-body p-4 p-md-5">
                <i class="fas fa-check-circle text-success" style="font-size: 4rem; color: #2A7F7A;"></i>
                
                <h4 class="mt-3 mb-2" style="font-family: 'Noto Serif Bengali', serif;">
                    রিসেট সম্পূর্ণ!
                </h4>
                
                <p class="text-muted small mb-4">
                    আপনার নতুন পাসওয়ার্ড সফলভাবে সেট করা হয়েছে।
                </p>
                
                <div class="d-grid gap-2">
                    <a href="{% url 'login' %}" class="btn btn-primary btn-lg rounded-pill">
                        <i class="fas fa-arrow-right me-2"></i> লগইন করুন
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
