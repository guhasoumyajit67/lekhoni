{% extends "base.html" %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4 text-center">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <i class="fas fa-envelope-open" style="font-size: 48px; color: #2A7F7A;"></i>
                <h4 class="mt-3">ইমেইল চেক করুন</h4>
                <p class="text-muted small">
                    আমরা আপনার ইমেইল ঠিকানায় পাসওয়ার্ড রিসেট করার নির্দেশনা পাঠিয়েছি।
                </p>
                <a href="{% url 'login' %}" class="btn btn-primary">লগইন পেজে ফিরুন</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
