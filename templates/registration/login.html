{% extends "base.html" %}
{% load static %}

{% block title %}লগইন - লেখনী{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm hover-lift border-0">
            <div class="card-body p-4 p-md-5">
                <h3 class="text-center mb-4" style="font-family: 'Noto Serif Bengali', serif;">
                    <i class="fas fa-sign-in-alt me-2" style="color: #2A7F7A;"></i>
                    লগইন করুন
                </h3>
                
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">ইউজারনেম</label>
                        <input type="text" name="username" id="id_username" class="form-control rounded-3" 
                               placeholder="আপনার ইউজারনেম" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-bold text-secondary small text-uppercase tracking-wider">পাসওয়ার্ড</label>
                        <input type="password" name="password" id="id_password" class="form-control rounded-3" 
                               placeholder="আপনার পাসওয়ার্ড" required>
                    </div>
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg rounded-pill">
                            <i class="fas fa-sign-in-alt me-2"></i> লগইন করুন
                        </button>
                    </div>
                </form>
                
                <p class="text-center mt-4 mb-1">
                    নতুন অ্যাকাউন্ট? 
                    <a href="{% url 'signup' %}" class="fw-bold text-decoration-none" style="color: #2A7F7A;">নিবন্ধন করুন</a>
                </p>
                <p class="text-center mb-0">
                    <a href="{% url 'password_reset' %}" class="text-decoration-none" style="color: #C45A3C;">পাসওয়ার্ড ভুলে গেছেন?</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
